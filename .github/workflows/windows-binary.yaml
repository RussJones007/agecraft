name: Build Windows binary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-binary:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up R and Rtools
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::RcppDate

      - name: Build source archive
        shell: pwsh
        run: |
          R CMD build .

      - name: Build Windows binary from source archive
        shell: pwsh
        run: |
          $source = Get-ChildItem -File -Filter 'agecraft_*.tar.gz' | Select-Object -First 1
          if (-not $source) { throw "Source archive not found" }
          R CMD INSTALL --build $source.FullName
          if ($LASTEXITCODE -ne 0) { throw "Windows binary build failed" }

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: agecraft-windows-binary
          path: agecraft_*.zip
          if-no-files-found: error
          retention-days: 30
